<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Jardín de Luciérnagas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            background-color: #020205; 
            margin: 0; 
            overflow: hidden; 
            color: white;
            font-family: 'Arial', sans-serif;
        }

        #app-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            filter: brightness(0.9) contrast(1.1);
        }

        /* Capa de interfaz superior (Logo y Footer) */
        #gui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .interactive {
            pointer-events: auto;
        }

        header h1 {
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            opacity: 0.5;
            text-transform: uppercase;
        }

        footer {
            letter-spacing: 0.3em;
            font-size: 0.6rem;
            opacity: 0.2;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="app-canvas"></div>

    <div id="gui-layer">
        <header class="flex justify-between items-center">
            <div class="interactive">
                <h1>Garden Flower</h1>
            </div>
            </header>

        <main>
            </main>

        <footer>
            Jardín de Recuerdos • 2026
        </footer>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        // Importamos initGarden. 
        // Usamos una versión (v=4.1) para forzar al navegador a limpiar caché tras los cambios
        import { initGarden } from './js/garden.js?v=4.1';

        // Usamos una función asíncrona para iniciar el jardín
        async function start() {
            try {
                // Esperamos a que la base de datos y la UI se carguen antes de decir que está OK
                await initGarden();
                console.log("Jardín inicializado correctamente con sincronización Gist.");
            } catch (error) {
                console.error("Error crítico al cargar el jardín:", error);
                // Si falla, al menos mostramos un mensaje en pantalla para no ver solo negro
                document.body.innerHTML += `<div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:red;">Error al conectar con el jardín. Revisa la consola.</div>`;
            }
        }

        // Ejecutamos la carga
        window.onload = start;
    </script>
</body>
</html>
