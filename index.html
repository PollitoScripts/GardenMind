<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín de Recuerdos | GardenFlower</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background: #0a0a12; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body class="text-white font-sans">

    <div id="canvas-container"></div>

    <div class="ui-layer min-h-screen flex flex-col justify-between p-6">
        
        <header class="flex justify-between items-center">
            <h1 class="text-2xl font-light tracking-widest uppercase">Jardín de Recuerdos</h1>
            <button id="btn-inventory" class="interactive bg-white/10 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 hover:bg-white/20 transition">
                🎒 Inventario
            </button>
        </header>

        <main class="text-center">
            <div id="daily-status" class="bg-black/40 backdrop-blur-lg p-4 rounded-xl max-w-sm mx-auto border border-white/10">
                <p id="status-text">Busca la luciérnaga de hoy...</p>
            </div>
        </main>

        <footer class="flex justify-center gap-4">
            <button id="btn-collect" class="interactive hidden bg-yellow-500 text-black font-bold px-8 py-3 rounded-full shadow-lg shadow-yellow-500/50 hover:scale-105 transition">
                ✨ CAPTURAR RECUERDO
            </button>
        </footer>
    </div>

    <div id="modal-inventory" class="interactive hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-white/10 w-full max-w-2xl rounded-2xl p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Tus Recuerdos</h2>
                <button onclick="toggleInventory()" class="text-zinc-400 hover:text-white">✕ Cerrar</button>
            </div>
            
            <div id="inventory-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-zinc-500 italic">Aún no has capturado ninguna luciérnaga...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
        // Función simple para abrir/cerrar inventario
        function toggleInventory() {
            const modal = document.getElementById('modal-inventory');
            modal.classList.toggle('hidden');
        }
        document.getElementById('btn-inventory').addEventListener('click', toggleInventory);
    </script>
</body>
</html>
